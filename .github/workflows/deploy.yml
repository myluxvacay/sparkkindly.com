name: Deploy

# A push to main deploys production; a push to staging deploys staging. The environment decides which SSH key the job
# can read, so a run on the staging branch can never see the production key (production is restricted to main).
on:
  push:
    branches: [main, staging]
  # Manual re-runs retry a failed content publish (the receiver's import is idempotent); the branch picked in the
  # UI decides the environment exactly as a push to that branch would.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DEPLOY_USER: ${{ github.ref_name == 'main' && 'sparkkindly' || 'sparkkindly-staging' }}
      SITE_RELEASE: ${{ github.ref_name == 'main' && 'true' || 'false' }}
    steps:
      # Full history so the content-change detection below can diff against the push's "before" commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run content:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

      - name: Detect content changes
        id: content
        run: |
          # The receiver publishes library content only when the release carries the PUBLISH_CONTENT marker.
          # Diff the push range for content/ and public/images/ (hero files ship in the release; their database
          # rows are refreshed by the same step). When the base commit is unavailable — a branch's first push or
          # a manual dispatch — publish anyway: the import is idempotent, so an unnecessary run is harmless.
          before='${{ github.event.before }}'
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            if git diff --name-only "$before" '${{ github.sha }}' -- content public/images | grep -q .; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Content publish marker: $(grep '^changed=' "$GITHUB_OUTPUT")"

      - name: Assemble release
        run: |
          mkdir release
          cp -r .next/standalone/. release/
          mkdir -p release/.next
          cp -r .next/static release/.next/static
          cp -r public release/public
          # Migrations ship with the release; the receiver runs migrate.sh before switching to it.
          cp -r db release/db
          cp deploy/migrate.sh release/migrate.sh
          # The worker (systemd timer) runs release/worker.mjs; pg resolves from the standalone node_modules.
          npm run worker:build
          # The video poster (its own systemd timer, 5B review M4) runs release/video-worker.mjs.
          npm run worker:video:build
          # Content publishing (owner-authorized automation, 16 Nov 2026): the receiver runs
          # release/content-publish.mjs after a healthy deploy when the PUBLISH_CONTENT marker is present.
          # The library snapshot ships in every release so the step is self-contained and re-runnable.
          npm run content:publish:build
          cp deploy/content-publish.sh release/content-publish.sh
          chmod +x release/content-publish.sh
          mkdir -p release/content
          cp -r content/articles content/quizzes release/content/
          if [ '${{ steps.content.outputs.changed }}' = 'true' ]; then
            touch release/PUBLISH_CONTENT
          fi
          ls -lh release/content-publish.mjs
          ls release/PUBLISH_CONTENT 2>/dev/null || echo "No content changes in this push; receiver will skip the content publish."
          chmod +x release/migrate.sh
          printf '%s' "$GITHUB_SHA" > release/RELEASE
          tar -czf release.tgz -C release .
          ls -lh release.tgz

      - name: Deliver to the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The login, not this command word, picks the target; the receiver gates on /api/health/ and rolls back itself.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$VPS_HOST" deploy < release.tgz
          rm -f ~/.ssh/deploy_key
